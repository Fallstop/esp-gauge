[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-gauge"
version = "0.1.0"
description = "Quiet native desktop instruments for ESP32 gauge boards"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials==6.8.3", "psutil==7.0.0", "pyserial==3.5"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.12.0"]

[project.gui-scripts]
esp-gauge = "esp_gauge.app:main"

[tool.setuptools.packages.find]
where = ["desktop"]

[tool.pytest.ini_options]
pythonpath = ["desktop"]
testpaths = ["tests"]

[tool.setuptools.package-data]
esp_gauge = ["assets/*.png", "assets/*.json"]

name: Release ESP Gauge
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build
        required: true
        default: v2.1.0
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve signed fixture bytes
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: uv tool install --with pip platformio==6.1.19
      - run: pio run -d firmware
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include tests/engine_test.cpp -o /tmp/engine-test && /tmp/engine-test
      - run: uv run python tools/package_firmware.py artifacts/firmware
      - run: npm ci --prefix desktop
      - run: npm --prefix desktop run tauri signer sign -- ../artifacts/firmware/firmware.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: artifacts/firmware/*
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-aarch64
          - os: macos-15-intel
            platform: darwin-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Preserve signed fixture bytes
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libxdo-dev patchelf
      - name: Use compatible AppImage runtime
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-x86_64 -o "$RUNNER_TEMP/appimage-runtime"
          echo "66f5b22f035022b8bdebb54c066aa6edc7b5db282fe6cdb372e7965f80772557  $RUNNER_TEMP/appimage-runtime" | sha256sum --check
          echo "LDAI_RUNTIME_FILE=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run tauri build
        env:
          LDAI_COMP: gzip
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Exercise packaged Linux executable
        if: runner.os == 'Linux'
        run: APPIMAGE_EXTRACT_AND_RUN=1 src-tauri/target/release/bundle/appimage/*.AppImage --diagnose
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/**/*.sig
  publish:
    needs: [firmware, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve signed fixture bytes
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/collected
      - run: uv run python tools/package_release.py artifacts/collected artifacts/release "$RELEASE_TAG"
      - run: gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --title "ESP Gauge ${RELEASE_TAG#v}" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
        env:
          GH_TOKEN: ${{ github.token }}

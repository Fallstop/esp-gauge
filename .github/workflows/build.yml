name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Package native application
        run: python -m PyInstaller --noconfirm --clean --windowed --name ESP-Gauge --paths desktop desktop/launch.py
      - name: Include instructions and dependency licenses
        shell: bash
        run: |
          cp README.md dist/
          cp THIRD_PARTY.md dist/
          cp -r docs dist/
          python tools/licenses.py
      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: tar -czf ESP-Gauge-Linux-x86_64.tar.gz -C dist .
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname ESP-Gauge -srcfolder dist -ov -format UDZO ESP-Gauge-macOS-arm64.dmg
      - name: Package Windows archive
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/* -DestinationPath ESP-Gauge-Windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ESP-Gauge-${{ runner.os }}-${{ runner.arch }}
          path: |
            ESP-Gauge-*.tar.gz
            ESP-Gauge-*.dmg
            ESP-Gauge-*.zip
          if-no-files-found: error
  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - name: Protocol, limits, smoothing, failsafe tests
        run: g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/include tests/core_test.cpp -o /tmp/core-test && /tmp/core-test
      - run: pio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-firmware
          path: |
            firmware/.pio/build/esp32dev/*.bin
            firmware/.pio/build/esp32dev/firmware.elf
            firmware/platformio.ini
            firmware/pins.md
            docs/protocol.md
